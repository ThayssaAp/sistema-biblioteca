<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Definir senha | Portal do Leitor</title>
    <link rel="stylesheet" href="./styles.css">
    <script src="./config.js" defer></script>
    <script src="./app.js" defer></script>
  </head>
  <body>
    <main class="page-shell">
      <section class="card" aria-labelledby="page-title">
        <p class="eyebrow">Primeiro acesso</p>
        <h1 id="page-title">Crie sua senha</h1>
        <p class="intro">A senha temporária não pode ser usada para acessar o portal. Defina uma senha com pelo menos 8 caracteres, uma letra e um dígito.</p>
        <form id="password-change-form" novalidate>
          <div class="field"><label for="new_password">Nova senha</label><input id="new_password" name="new_password" type="password" autocomplete="new-password" required><p id="new_password-error" class="field-error" aria-live="polite"></p></div>
          <div class="field"><label for="password_confirmation">Confirme a nova senha</label><input id="password_confirmation" name="password_confirmation" type="password" autocomplete="new-password" required><p id="password_confirmation-error" class="field-error" aria-live="polite"></p></div>
          <button id="submit-button" class="primary-button" type="submit">Salvar senha</button>
          <p id="form-status" class="status" role="status" aria-live="polite"></p>
        </form>
      </section>
    </main>
  </body>
</html>
