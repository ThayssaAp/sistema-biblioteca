<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cadastrar leitor | Biblioteca Comunitária</title>
    <link rel="stylesheet" href="./styles.css">
    <script src="./config.js" defer></script>
    <script src="./app.js" defer></script>
  </head>
  <body>
    <main class="page-shell">
      <section class="card" aria-labelledby="page-title">
        <p class="eyebrow">Atendimento de balcão</p>
        <h1 id="page-title">Cadastrar leitor</h1>
        <p class="intro">Informe os dados da pessoa que utilizará o acervo.</p>
        <form id="reader-form" novalidate>
          <div class="field"><label for="cpf">CPF</label><input id="cpf" name="cpf" inputmode="numeric" autocomplete="off" required autofocus><p id="cpf-error" class="field-error" aria-live="polite"></p></div>
          <div class="field"><label for="name">Nome completo</label><input id="name" name="name" autocomplete="name" required><p id="name-error" class="field-error" aria-live="polite"></p></div>
          <div class="field"><label for="birth_date">Data de nascimento</label><input id="birth_date" name="birth_date" type="text" inputmode="numeric" placeholder="dd/mm/aaaa" maxlength="10" autocomplete="bday" required><p id="birth_date-error" class="field-error" aria-live="polite"></p></div>
          <div class="field"><label for="address">Endereço</label><input id="address" name="address" autocomplete="street-address" required><p id="address-error" class="field-error" aria-live="polite"></p></div>
          <div class="field"><label for="phone">Telefone</label><input id="phone" name="phone" type="tel" autocomplete="tel" required><p id="phone-error" class="field-error" aria-live="polite"></p></div>
          <div class="field"><label for="email">E-mail <span>(opcional)</span></label><input id="email" name="email" type="email" autocomplete="email"><p id="email-error" class="field-error" aria-live="polite"></p></div>
          <button id="submit-button" class="primary-button" type="submit">Cadastrar leitor</button>
          <p id="form-status" class="status" role="status" aria-live="polite"></p>
        </form>
        <nav class="links" aria-label="Leitores"><a href="./consulta.html">Consultar leitores</a><a href="../login/index.html">Voltar</a></nav>
      </section>
    </main>
  </body>
</html>
